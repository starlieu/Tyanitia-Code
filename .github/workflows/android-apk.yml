name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/gameplay-hud-render-artifacts

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          lfs: true

      - name: Read Godot version
        id: godot
        run: echo "version=$(tr -d '[:space:]' < .github/godot_version.txt)" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"

      - name: Download Godot .NET
        run: |
          VERSION="${{ steps.godot.outputs.version }}"
          curl -fsSL "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_mono_linux_x86_64.zip" -o godot.zip
          unzip -q godot.zip -d godot-bin
          echo "$PWD/godot-bin" >> "$GITHUB_PATH"
          chmod +x godot-bin/Godot_v${VERSION}-stable_mono_linux.x86_64
          echo "GODOT_BIN=$PWD/godot-bin/Godot_v${VERSION}-stable_mono_linux.x86_64" >> "$GITHUB_ENV"

      - name: Install Godot export templates
        run: |
          VERSION="${{ steps.godot.outputs.version }}"
          mkdir -p "$HOME/.local/share/godot/export_templates/${VERSION}.stable"
          curl -fsSL "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_mono_export_templates.tpz" -o templates.tpz
          unzip -p templates.tpz templates/android_source.zip > android_source.zip
          unzip -q android_source.zip -d "$HOME/.local/share/godot/export_templates/${VERSION}.stable"

      - name: Restore and build C# project
        run: dotnet restore Tyanitia.csproj && dotnet build Tyanitia.csproj --configuration ExportRelease --no-restore

      - name: Export Android debug APK
        run: |
          mkdir -p build/android
          "$GODOT_BIN" --headless --path . --editor --quit
          "$GODOT_BIN" --headless --path . --export-debug Android build/android/Tyanitia-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Tyanitia-debug-android
          path: build/android/Tyanitia-debug.apk
          if-no-files-found: error
          retention-days: 14
